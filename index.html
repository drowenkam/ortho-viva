<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ortho Viva Study Guide — Case A Z.C.K. &amp; Case B W.T.N.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ortho Viva">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#B8325E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#18212F; --muted:#586477; --line:#D9E0E8; --hover:#EAF0F6;
  --caseA:#B8325E; --caseA-soft:#FBE8EF;
  --caseB:#0B7477; --caseB-soft:#DCF2F1;
  --topic:#2F57B0; --topic-soft:#E6EDFB;
  --ceph:#B4470F; --ceph-soft:#FDEBDD;
  --hb:#5B44B2; --hb-soft:#EDE9FB;
  --test:#7A4F00; --test-soft:#FFF2CC;
  --ans:#1D6E43; --ans-soft:#E2F3E8;
  --trap:#B83227; --trap-soft:#FCE5E2;
  --warn:#9A4D00; --warn-soft:#FDEBD8;
  --mark:#FFE36E; --mark-ink:#18212F;
  --bone:#7C8796; --soft:#A7B1BE; --dim:#C9D1DB;
  --shadow:0 1px 2px rgba(24,33,47,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F141B; --surface:#17202B; --ink:#E6EBF2; --muted:#9AA6B7; --line:#2A3544; --hover:#1E2936;
    --caseA:#F27FA4; --caseA-soft:#3A1E2A; --caseB:#53CFC6; --caseB-soft:#11302F;
    --topic:#8DB0F7; --topic-soft:#1C2A45; --ceph:#FB9A5B; --ceph-soft:#3A2416;
    --hb:#B3A1F7; --hb-soft:#2A2446;
    --test:#F2C35E; --test-soft:#3A2F12; --ans:#74D6A0; --ans-soft:#14301F;
    --trap:#F2897D; --trap-soft:#3B1D1A; --warn:#F5B26B; --warn-soft:#3A2814;
    --mark:#6E5A00; --mark-ink:#FFF5C7; --bone:#8E9AAB; --soft:#6C788A; --dim:#3A4657; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F141B; --surface:#17202B; --ink:#E6EBF2; --muted:#9AA6B7; --line:#2A3544; --hover:#1E2936;
  --caseA:#F27FA4; --caseA-soft:#3A1E2A; --caseB:#53CFC6; --caseB-soft:#11302F;
  --topic:#8DB0F7; --topic-soft:#1C2A45; --ceph:#FB9A5B; --ceph-soft:#3A2416;
  --hb:#B3A1F7; --hb-soft:#2A2446;
  --test:#F2C35E; --test-soft:#3A2F12; --ans:#74D6A0; --ans-soft:#14301F;
  --trap:#F2897D; --trap-soft:#3B1D1A; --warn:#F5B26B; --warn-soft:#3A2814;
  --mark:#6E5A00; --mark-ink:#FFF5C7; --bone:#8E9AAB; --soft:#6C788A; --dim:#3A4657; --shadow:none;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px); }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:17px; line-height:1.55;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
a{ color:var(--topic); }
mark{ background:var(--mark); color:var(--mark-ink); padding:0 .15em; border-radius:2px; }
strong{ font-weight:700; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--topic); outline-offset:2px; }

.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 18px; }
.bar h1{ font-size:1.05rem; margin:0 12px 0 0; white-space:nowrap; }
.bar h1 span{ color:var(--muted); font-weight:400; }
.search{ flex:1 1 220px; min-width:160px; max-width:360px; }
.search input{ width:100%; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; font-size:.95rem; }
.toggle{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:.9rem; }
.toggle[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.bar .count{ font-size:.85rem; color:var(--muted); margin-left:auto; }

.layout{ display:grid; grid-template-columns:250px minmax(0,1fr); gap:28px; max-width:1240px; margin:0 auto; padding:22px 18px 80px; }
nav.side{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 76px); align-self:start; max-height:calc(100vh - 100px); overflow:auto; }
nav.side a{ display:flex; justify-content:space-between; gap:8px; text-decoration:none; color:var(--ink); padding:8px 10px; border-radius:8px; border-left:4px solid transparent; font-size:.95rem; }
nav.side a:hover{ background:var(--hover); }
nav.side a .p{ font-size:.8rem; color:var(--muted); white-space:nowrap; }
nav.side a[data-c="A"]{ border-left-color:var(--caseA); }
nav.side a[data-c="B"]{ border-left-color:var(--caseB); }
nav.side a[data-c="T"]{ border-left-color:var(--topic); }
nav.side a[data-c="C"]{ border-left-color:var(--ceph); }
nav.side a[data-c="H"]{ border-left-color:var(--hb); }
nav.side a[data-c="F"]{ border-left-color:var(--trap); }
nav.side .sub{ padding-left:22px; font-size:.86rem; color:var(--muted); }
main{ min-width:0; max-width:920px; }

section.sec{ margin:0 0 44px; }
.sechead{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:3px solid var(--line); padding-bottom:8px; margin-bottom:16px; }
.sechead h2{ margin:0; font-size:1.6rem; line-height:1.2; }
.sec[data-c="A"] .sechead{ border-color:var(--caseA); }
.sec[data-c="B"] .sechead{ border-color:var(--caseB); }
.sec[data-c="T"] .sechead{ border-color:var(--topic); }
.sec[data-c="C"] .sechead{ border-color:var(--ceph); }
.sec[data-c="H"] .sechead{ border-color:var(--hb); }
.sec[data-c="F"] .sechead{ border-color:var(--trap); }
.lead{ font-size:1.02rem; margin:0 0 16px; max-width:72ch; }
h3{ font-size:1.15rem; margin:28px 0 10px; }
.progress{ font-size:.85rem; color:var(--muted); }
.progress b{ color:var(--ink); }

.legend{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
.chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:999px; font-size:.82rem; font-weight:700; line-height:1.6; white-space:nowrap; }
.c-A{ background:var(--caseA-soft); color:var(--caseA); }
.c-B{ background:var(--caseB-soft); color:var(--caseB); }
.c-T{ background:var(--topic-soft); color:var(--topic); }
.c-C{ background:var(--ceph-soft); color:var(--ceph); }
.c-hb{ background:var(--hb-soft); color:var(--hb); font-weight:400; }
.c-test{ background:var(--test-soft); color:var(--test); }
.c-ans{ background:var(--ans-soft); color:var(--ans); }
.c-trap{ background:var(--trap-soft); color:var(--trap); }
.c-warn{ background:var(--warn-soft); color:var(--warn); }
.c-gray{ background:var(--hover); color:var(--muted); }
.c-hy{ background:var(--mark); color:var(--mark-ink); }

.q{ background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--topic); border-radius:10px; padding:14px 18px; margin:0 0 14px; box-shadow:var(--shadow); }
.q[data-c="A"]{ border-left-color:var(--caseA); }
.q[data-c="B"]{ border-left-color:var(--caseB); }
.q[data-c="C"]{ border-left-color:var(--ceph); }
.q.done{ opacity:.72; }
.qtop{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:6px; }
.qtop .spacer{ flex:1; }
.tick{ display:inline-flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); cursor:pointer; }
.tick input{ width:18px; height:18px; accent-color:var(--ans); }
.qtext{ font-weight:700; font-size:1.06rem; margin:2px 0 10px; }
.testing{ background:var(--test-soft); border-radius:8px; padding:8px 12px; margin:0 0 10px; font-size:.95rem; }
.testing b{ color:var(--test); }
.answer{ border-left:3px solid var(--ans); padding:2px 0 2px 12px; margin:0 0 10px; }
.answer .lab{ color:var(--ans); font-weight:700; font-size:.9rem; }
.answer ul{ margin:4px 0 0; padding-left:20px; }
.answer li{ margin:3px 0; }
.answer.plain{ border-left:0; padding-left:0; }
.hbrow{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.hbrow .lab{ font-size:.85rem; color:var(--hb); font-weight:700; margin-right:2px; }
.reveal{ display:none; border:1px dashed var(--ans); color:var(--ans); background:transparent; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:.9rem; margin-bottom:8px; }
body.selftest .q:not(.open) .testing, body.selftest .q:not(.open) .answer{ display:none; }
body.selftest .q:not(.open) .reveal{ display:inline-block; }
.hidden{ display:none !important; }

.q.model{ border-left-width:8px; }
.mtitle{ font-weight:700; font-size:1.12rem; margin:2px 0 10px; }
.steps{ display:grid; gap:10px; margin:4px 0 12px; }
.step{ display:grid; grid-template-columns:118px 1fr; gap:12px; align-items:start; }
.step > .chip{ justify-self:start; margin-top:2px; }
.step p{ margin:0 0 4px; }
.step ul{ margin:2px 0 0; padding-left:20px; }
.step li{ margin:2px 0; }
.fu{ background:var(--hover); border-radius:8px; padding:10px 14px; margin:0 0 10px; }
.fu .lab{ font-weight:700; font-size:.9rem; color:var(--muted); }
.fu p{ margin:6px 0; }
.fu .fq{ font-style:italic; }

.tw{ overflow-x:auto; margin:6px 0 16px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
table{ border-collapse:collapse; width:100%; font-size:.92rem; }
th,td{ text-align:left; vertical-align:top; padding:8px 12px; border-bottom:1px solid var(--line); }
th{ background:var(--hover); font-weight:700; white-space:nowrap; }
tr:last-child td{ border-bottom:0; }
td.num{ white-space:nowrap; font-variant-numeric:tabular-nums; }
td.big{ background:var(--trap-soft); color:var(--trap); font-weight:700; }
td.odd{ background:var(--warn-soft); color:var(--warn); font-weight:700; }

.fix{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin:0 0 10px; }
.fix .sev{ grid-row:span 3; align-self:start; }
.fix .issue{ font-weight:700; }
.fix .where{ font-size:.86rem; color:var(--muted); }
.fix .do{ font-size:.95rem; }
.fix .do b{ color:var(--ans); }
.resolved{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }

.box{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:0 0 14px; }
.box.A{ border-top:5px solid var(--caseA); }
.box.B{ border-top:5px solid var(--caseB); }
.box.note{ border-left:5px solid var(--hb); }
.box.cephnote{ border-left:5px solid var(--ceph); }
.box.trap{ border-left:5px solid var(--trap); background:var(--trap-soft); }
.box h4{ margin:0 0 6px; font-size:1.02rem; }
.box p{ margin:6px 0; }
.box ul{ margin:6px 0; padding-left:20px; }
.flow{ list-style:none; padding:0; margin:0 0 16px; display:grid; gap:8px; }
.flow li{ display:grid; grid-template-columns:72px 1fr; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
.flow .t{ font-weight:700; color:var(--topic); font-variant-numeric:tabular-nums; }
.formula{ font-family:"Cambria Math","STIX Two Math","Times New Roman",serif; font-size:1.1rem; background:var(--hover); border-radius:8px; padding:10px 14px; margin:8px 0; overflow-x:auto; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:8px; min-height:120px; }
.card .n{ font-size:.8rem; color:var(--muted); }
.card .fa{ display:none; border-top:1px dashed var(--line); padding-top:8px; color:var(--ans); }
.card.open .fa{ display:block; }
.card .hint{ font-size:.8rem; color:var(--muted); margin-top:auto; }
.card.open .hint{ display:none; }

/* ceph explorer */
.ceph{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:16px; align-items:start; margin:0 0 18px; }
.cephfig{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px; position:sticky; top:calc(env(safe-area-inset-top,0px) + 80px); }
.cephfig svg{ width:100%; height:auto; display:block; }
.cephfig .cap{ font-size:.8rem; color:var(--muted); padding:4px 8px 2px; }
svg .outline{ fill:none; stroke:var(--bone); stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
svg .outline.st{ stroke:var(--soft); stroke-dasharray:0; }
svg .tooth{ fill:var(--hover); stroke:var(--bone); stroke-width:1.4; }
svg .pl{ stroke:var(--dim); stroke-width:1.3; stroke-dasharray:5 4; fill:none; }
svg .pl.on{ stroke:var(--ceph); stroke-width:2.6; stroke-dasharray:0; }
svg .aux{ stroke:var(--ceph); stroke-width:2; stroke-dasharray:3 3; fill:none; display:none; }
svg .aux.on{ display:inline; }
svg .arc{ fill:none; stroke:var(--ceph); stroke-width:2.2; }
svg .pt circle{ fill:var(--surface); stroke:var(--ink); stroke-width:1.6; cursor:pointer; }
svg .pt text{ font-size:12px; font-weight:700; fill:var(--muted); paint-order:stroke; stroke:var(--surface); stroke-width:3px; cursor:pointer; }
svg .pt.on circle{ fill:var(--ceph); stroke:var(--ceph); }
svg .pt.on text{ fill:var(--ceph); }
svg .pt.soft circle{ stroke:var(--soft); }
.cephgallery{ display:none; }
.print-only-g{ display:none; }
@media print{ .print-only-g{ display:block; } }
.cephgallery figure{ margin:0; border:1px solid var(--line); border-radius:8px; padding:6px; break-inside:avoid; }
.cephgallery figcaption{ font-size:.8rem; padding:2px 4px; }
.cephctl{ display:flex; flex-direction:column; gap:10px; }
.grp{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.grp .gl{ font-size:.82rem; font-weight:700; color:var(--muted); margin-bottom:6px; }
.grp .btns{ display:flex; flex-wrap:wrap; gap:6px; }
.mbtn{ border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:4px 11px; font-size:.86rem; cursor:pointer; }
.mbtn[aria-pressed="true"]{ background:var(--ceph); color:#fff; border-color:var(--ceph); }
.panel{ background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--ceph); border-radius:10px; padding:14px 16px; }
.panel h4{ margin:0 0 4px; font-size:1.1rem; }
.panel .kind{ font-size:.8rem; color:var(--ceph); font-weight:700; }
.panel p{ margin:6px 0; }
.panel .vals{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0; }
.panel .v{ border-radius:8px; padding:8px 10px; font-size:.9rem; }
.panel .v.A{ background:var(--caseA-soft); }
.panel .v.B{ background:var(--caseB-soft); }
.panel .v b{ display:block; font-size:.78rem; }
.panel .v.A b{ color:var(--caseA); } .panel .v.B b{ color:var(--caseB); }
.panel .v .n{ font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; }
.panel .norms{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.panel .trapline{ background:var(--trap-soft); border-radius:8px; padding:8px 10px; font-size:.92rem; margin:8px 0; }
.panel .trapline b{ color:var(--trap); }

@media (max-width:980px){ .ceph{ grid-template-columns:1fr; } .cephfig{ position:static; } }
@media (max-width:900px){
  .layout{ grid-template-columns:1fr; padding-top:12px; }
  nav.side{ position:static; max-height:none; display:flex; overflow-x:auto; gap:6px; padding-bottom:6px; }
  nav.side a{ border-left:0; border-bottom:3px solid transparent; white-space:nowrap; background:var(--surface); }
  nav.side a[data-c="A"]{ border-bottom-color:var(--caseA); } nav.side a[data-c="B"]{ border-bottom-color:var(--caseB); }
  nav.side a[data-c="T"]{ border-bottom-color:var(--topic); } nav.side a[data-c="C"]{ border-bottom-color:var(--ceph); }
  nav.side a[data-c="H"]{ border-bottom-color:var(--hb); } nav.side a[data-c="F"]{ border-bottom-color:var(--trap); }
  nav.side a .p, nav.side .sub{ display:none; }
  .bar h1 span{ display:none; } .bar .count{ margin-left:0; }
  .grid2{ grid-template-columns:1fr; }
}
@media (max-width:600px){ .step{ grid-template-columns:1fr; gap:4px; } .panel .vals{ grid-template-columns:1fr; } }
@media print{
  .bar, nav.side, .reveal, .tick, .cephctl .grp{ display:none !important; }
  .layout{ display:block; } .cephfig{ position:static; }
  body.selftest .q .testing, body.selftest .q .answer{ display:block !important; }
  .q, .fix, .box{ break-inside:avoid; }
  .cephgallery{ display:grid !important; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
  .card .fa{ display:block !important; } .card .hint{ display:none !important; }
  .ceph{ display:none !important; } .sec{ break-before:page; } .sec:first-child{ break-before:auto; }
  body{ font-size:13px; background:#fff; } body::before{ display:none; } .tw{ overflow:visible; } th{ white-space:normal; }
}
@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Study tools">
  <h1>Ortho viva study guide <span>Case A Z.C.K. · Case B W.T.N.</span></h1>
  <div class="search"><input id="q" type="search" placeholder="Search, e.g. torque, Wits, nasion, TAD" aria-label="Search questions"></div>
  <button class="toggle" id="tSelf" aria-pressed="false">Self-test: hide answers</button>
  <button class="toggle" id="tHy" aria-pressed="false">High-yield only</button>
  <button class="toggle" id="tTodo" aria-pressed="false">Not yet revised</button>
  <button class="toggle" id="tTheme" aria-pressed="false" title="Switch light or dark">Dark</button>
  <span class="count" id="count"></span>
</div>
<div class="layout">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<script>
/* ===================== CASE CONTENT (updated records, 26/10/2026) ===================== */
const HB_NOTE = "Page numbers are the PDF pages of the uploaded Handbook of Orthodontics (Cobourne & DiBiase, 3rd ed., 1,431-page ebook). Figure, box and “Where is the evidence” (WITE) numbers match the printed book.";

const SCRIPT_A = "Z.C.K. is a 13-year-9-month-old Chinese boy at bond-up, in his pubertal growth spurt (voice change 3 months later), who complained that his upper front teeth stuck out. He has a <mark>Class II division 1 incisor relationship with a 5 mm overjet on a Class I skeletal base</mark> (ANB 2.6°, Mills-corrected ≈ 3.8°, Wits +1.6 mm) with average vertical proportions (MMPA 26°, LAFH 54.5%). Molars and canines are Class I. Crowding is 2.2 mm upper and <mark>6.2 mm lower</mark>, with a 4–5 mm curve of Spee and <mark>bimaxillary protrusion</mark>: upper incisors 122.8°, lower 102.3°, L1–APog 7.2 mm and lower lip 5 mm ahead of the E-line. I extracted four first premolars and used conventional MBT 0.022-inch twin brackets with Class II elastics. At 30 months the crowding is relieved, spaces are closed and the overjet is about 2 mm, but the <mark>upper incisors are over-retroclined at 91.9°</mark>, the overbite has deepened and the right molar has slipped to half-unit Class II. I’d like to discuss re-establishing torque and finishing.";

 {id:"A6",cat:"Planning",q:"The Bolton anterior ratio is 74.4%. What does it mean?",a:["About ==2.5 mm maxillary anterior excess==: expect a small residual overjet or difficulty getting Class I canines once torque is restored.","Options: upper interproximal reduction, a little extra upper torque, or reshaping the laterals. Currently masked by retroclined upper incisors."],h:["Bolton p385","p533–536","p867"]},

 {id:"A9",cat:"Mechanics",q:"Why lacebacks?",a:["To stop the tipped MBT canine crowns moving forward and proclining the incisors during alignment; reasonable with 6.2 mm lower crowding.","Evidence: ==little effect on incisor position== and possible anchorage loss (Fleming 2013)."],h:["Lacebacks p692–694","Fig 10.54"]},

 {id:"A19",cat:"Finishing",hy:true,q:"The 36 bracket is too gingival, with its mesial marginal ridge 1 mm above 35. What will you do?",t:"Bracket positioning errors and how they show up.",a:["A bracket placed too gingivally ==extrudes the tooth== on a straight wire, leaving a marginal ridge step and a possible interference.","==Rebond 36== at the correct height (your plan lists 12 and 45 but not 36), step back to a flexible wire, then return to the working wire.","Alternative: a step bend, but rebonding is cleaner."],h:["Bracket positioning p676–677","Finishing p699–701"]},
 {id:"A10",cat:"Mechanics",q:"Your plan uses 0.018 round SS for arch coordination after torque correction. Any concern?",a:["A round wire gives ==no torque control==, so the incisor torque you just restored could be lost.","Coordinate arches in a rectangular wire (e.g. 0.019 × 0.025 SS) with first-order bends at 36 and 46."],h:["Finishing p699–701","Prescriptions p677–686"]},

 {id:"B19",cat:"Finishing",q:"17 and 27 are buccally tilted and the lower molars lingually tilted. Significance?",a:["Check the ==transverse and curve of Wilson==: buccal upper and lingual lower molars risk non-working interferences and a scissor-bite tendency.","Upper: palatal crown (buccal root) torque on 17/27 in a rectangular wire, or a TPA. Lower: buccal crown torque. Your plan covers the lower molars but ==not 17/27==."],h:["Palatal arches p661–663","Finishing p699–701"]},
 {id:"B10",cat:"Finishing",hy:true,q:"Lateral open bite at 35 and left canine half-unit Class II. Plan?",a:["Check ==35 bracket height== and the unlevelled curve of Spee; reposition and re-level on a flexible wire.","Short vertical or box elastics to settle; correct the left Class II with differential mechanics or a left TAD rather than heavier elastics."],h:["Bracket positioning p676–677","Finishing p699–701"]},
 {id:"B11",cat:"Finishing",hy:true,q:"Your aims include Class I canines, but the remaining plan has no step for the left half-unit Class II. How will you correct it?",t:"Examiners notice when an aim has no matching plan.",a:["Add it to the plan: ==differential space closure on the left== (retract 23 against a reinforced posterior unit), a ==left buccal TAD==, or brief light left Class II elastics on rectangular SS with vertical monitoring.","The anterior Bolton excess is bilateral, so it ==can’t explain a one-sided Class II==; check for left anchorage loss and elastic wear.","If it can’t be fully corrected, a half-unit Class II canine on one side may be accepted, but present it as a compromise. Dropping lower IPR was right: it would add space to close."],h:["Anchorage loss p350–351","Buccal occlusion p528","Bolton p385","Ch 11 p725–727"]},
 {id:"B12",cat:"Finishing",q:"Root angulation at 12, 35 and 43: how will you correct it?",a:["Progress DPT; ==reposition brackets==; step back to a flexible wire, then return to the working wire."],h:["p676–677","p699–701"]},
 {id:"B13",cat:"Complications",q:"21 has a chipped incisal edge. What would you do?",a:["Record when and how it happened, check mobility, ==pulp sensibility and a periapical==. Composite after debond. Document it in the record."],h:["Enamel fracture p93","Trauma p534–535"]},
 {id:"B14",cat:"Complications",q:"Root resorption: risk and monitoring?",a:["Risk: extraction, large torque change, elastics. No significant resorption on the progress DPT; periapicals before any re-torquing."],h:["p94–95","p303–306"]},

 {id:"B16",cat:"Retention",q:"Justify your retention plan.",a:["Indefinite retention (Little); bonded 3–3 upper and lower + VFRs full-time 6 months then nights; fixed retainer failure ==12–50%== for multistrand."],h:["p974–990","p984","WITE 13.8 p989"]},

function seg(id){ const [a,b,ea,eb]=LINES[id]; const A=gp(a), B=gp(b); const dx=B[0]-A[0], dy=B[1]-A[1];
  return [A[0]-dx*ea, A[1]-dy*ea, B[0]+dx*eb, B[1]+dy*eb]; }
function inter(l1,l2){ const [x1,y1,x2,y2]=seg(l1), [x3,y3,x4,y4]=seg(l2);
  const d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4); if(Math.abs(d)<1e-9) return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d; return [x1+t*(x2-x1), y1+t*(y2-y1)]; }
function foot(p,l){ const [x1,y1,x2,y2]=seg(l); const dx=x2-x1, dy=y2-y1; const t=((p[0]-x1)*dx+(p[1]-y1)*dy)/(dx*dx+dy*dy); return [x1+t*dx, y1+t*dy]; }
function arcPath(V,P1,P2,r){
  let a1=Math.atan2(P1[1]-V[1],P1[0]-V[0]), a2=Math.atan2(P2[1]-V[1],P2[0]-V[0]);
  let d=a2-a1; while(d<=-Math.PI) d+=2*Math.PI; while(d>Math.PI) d-=2*Math.PI;
  const s=[V[0]+r*Math.cos(a1), V[1]+r*Math.sin(a1)], e=[V[0]+r*Math.cos(a1+d), V[1]+r*Math.sin(a1+d)];
  return `M ${s[0].toFixed(1)} ${s[1].toFixed(1)} A ${r} ${r} 0 0 ${d>0?1:0} ${e[0].toFixed(1)} ${e[1].toFixed(1)}`;
}

main.innerHTML = sections.map(s=>`<section class="sec" id="${s.id}" data-c="${s.c}">${s.html==="__CEPH__"?cephSection():s.html}</section>`).join("");
nav.innerHTML = sections.map(s=>`<a href="#${s.id}" data-c="${s.c}" data-go="${s.id}"><span>${esc(s.nav)}</span>${s.count?`<span class="p" data-navprog="${s.c}"></span>`:""}</a>`

const scrollTo = id => { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); };
nav.addEventListener("click",e=>{ const a=e.target.closest("[data-go]"); if(!a) return; e.preventDefault(); scrollTo(a.dataset.go); });

const allQ = () => [...document.querySelectorAll(".q")];
function updateProgress(){
  ["A","B","C","T"].forEach(c=>{
    const qs=allQ().filter(q=>q.dataset.c===c), n=qs.filter(q=>done[q.dataset.id]).length;
    document.querySelectorAll(`[data-prog="${c}"]`).forEach(el=>el.innerHTML=`<b>${n}</b> of ${qs.length} revised`);
    document.querySelectorAll(`[data-navprog="${c}"]`).forEach(el=>el.textContent=`${n}/${qs.length}`);
  });
}
main.addEventListener("change",e=>{
  const id=e.target.dataset.done; if(!id) return;
  if(e.target.checked) done[id]=1; else delete done[id];
  store.set("vivaDone2",done); e.target.closest(".q").classList.toggle("done",e.target.checked);
  updateProgress(); applyFilters();
});
main.addEventListener("click",e=>{
  if(e.target.matches("[data-reveal]")){ e.target.closest(".q").classList.add("open"); return; }
  const j=e.target.closest("[data-jump]"); if(j){ e.preventDefault(); scrollTo(j.dataset.jump); return; }
  const mb=e.target.closest(".mbtn"); if(mb){ setCeph(mb.dataset.k, mb.dataset.id); return; }
  const pt=e.target.closest(".pt"); if(pt){ setCeph("p", pt.dataset.p); return; }
  const card=e.target.closest(".card"); if(card) card.classList.toggle("open");
});
main.addEventListener("keydown",e=>{ const pt=e.target.closest&&e.target.closest(".pt"); if(pt && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); setCeph("p",pt.dataset.p); } });

const state={self:false,hy:false,todo:false,q:""};
function setToggle(btn,key){ btn.addEventListener("click",()=>{ state[key]=!state[key]; btn.setAttribute("aria-pressed",state[key]);
  if(key==="self"){ document.body.classList.toggle("selftest",state.self); allQ().forEach(q=>q.classList.remove("open")); } applyFilters(); }); }
setToggle(document.getElementById("tSelf"),"self"); setToggle(document.getElementById("tHy"),"hy"); setToggle(document.getElementById("tTodo"),"todo");
document.getElementById("q").addEventListener("input",e=>{ state.q=e.target.value.trim().toLowerCase(); applyFilters(); });
function applyFilters(){
  let shown=0;
  allQ().forEach(q=>{ const ok=(!state.hy||q.dataset.hy==="1")&&(!state.todo||!done[q.dataset.id])&&(!state.q||q.textContent.toLowerCase().includes(state.q));
    q.classList.toggle("hidden",!ok); if(ok) shown++; });
  document.getElementById("count").textContent = (state.hy||state.todo||state.q) ? `${shown} questions shown` : `${allQ().length} questions`;
}
const tTheme=document.getElementById("tTheme");
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncTheme(){ tTheme.textContent = isDark() ? "Light" : "Dark"; }
const savedTheme=store.get("vivaTheme"); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
tTheme.addEventListener("click",()=>{ const t=isDark()?"light":"dark"; document.documentElement.dataset.theme=t; store.set("vivaTheme",t); syncTheme(); });
syncTheme(); updateProgress(); applyFilters();
(function buildGallery(){ const g=document.getElementById("cgal"), src=document.querySelector(".cephfig svg"); if(!g||!src) return;
  g.innerHTML = MEAS.map(m=>{ setCeph("m",m.id); const v=m.vals.map(x=>x.replace("!",""));
    return `<figure>${src.outerHTML}<figcaption><strong>${esc(m.n)}</strong> · ${esc(m.hb)}<br>A ${esc(v[0])} → ${esc(v[1])}${m.u} · B ${esc(v[2])} → ${esc(v[3])}${m.u}</figcaption></figure>`; }).join(""); })();
setCeph("m","ANB");
if(location.hash){ const el=document.getElementById(location.hash.slice(1)); if(el) setTimeout(()=>el.scrollIntoView(),50); }
